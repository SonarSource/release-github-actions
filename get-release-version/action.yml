name: 'Get Release Version'
description: 'Gets the release version and commit SHA from the repox status.'
author: 'SonarSource'

inputs:
  github-token:
    description: 'The GitHub token for API calls.'
    required: true
    default: ${{ github.token }}
  branch:
    description: 'The branch from which to get the version.'
    required: false
    default: 'master'

outputs:
  release-version:
    description: 'The extracted release version from repox status.'
    value: ${{ steps.get_release_version.outputs.release-version }}
  commit-sha:
    description: 'The commit SHA whose repox status supplied the release version.'
    value: ${{ steps.get_release_version.outputs.commit-sha }}

runs:
  using: 'composite'
  steps:
    - name: Get release version
      id: get_release_version
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BRANCH_NAME: ${{ inputs.branch }}
      run: |
        STATUS_RESPONSE=$(gh api "/repos/${{ github.repository }}/commits/$BRANCH_NAME/status")
        RELEASE_VERSION=$(jq -r ".statuses[] | select(.context | startswith(\"repox-$BRANCH_NAME\")) | .description | split(\"'\")[1]" <<< "$STATUS_RESPONSE")
        COMMIT_SHA=$(jq -r '.sha // empty' <<< "$STATUS_RESPONSE")

        if [ -z "$RELEASE_VERSION" ]; then
          echo "❌ Could not extract release version from repox status"
          exit 1
        fi

        if [ -z "$COMMIT_SHA" ]; then
          echo "❌ Could not extract commit SHA from repox status"
          exit 1
        fi

        echo "✅ Extracted release version: $RELEASE_VERSION"
        echo "✅ Resolved release commit: $COMMIT_SHA"

        echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
        echo "commit-sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

        echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
