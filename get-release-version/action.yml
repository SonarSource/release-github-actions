name: 'Get Release Version'
description: 'Gets the release version from the repox status and sets it as output and environment variable.'
author: 'SonarSource'

inputs:
  github-token:
    description: 'The GitHub token for API calls.'
    required: true
    default: ${{ github.token }}
  branch:
    description: 'The branch from which to get the version.'
    required: false
    default: 'master'

outputs:
  release-version:
    description: 'The extracted release version from repox status.'
    value: ${{ steps.get_release_version.outputs.release-version }}

runs:
  using: 'composite'
  steps:
    - name: Get release version
      id: get_release_version
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BRANCH_NAME: ${{ inputs.branch }}
      run: |
        STATUS_JSON=$(gh api "/repos/${{ github.repository }}/commits/$BRANCH_NAME/status")
        REPO_NAME="${GITHUB_REPOSITORY#*/}"

        # See README.md ("Why prefer the repo-specific context?") for the rationale.
        RELEASE_VERSION=$(echo "$STATUS_JSON" | jq -r --arg ctx "repox-$REPO_NAME-$BRANCH_NAME" '.statuses[] | select(.context == $ctx) | ((.description // "") | split("\u0027")[1] // empty)')

        if [ -z "$RELEASE_VERSION" ]; then
          RELEASE_VERSION=$(echo "$STATUS_JSON" | jq -r --arg prefix "repox-$BRANCH_NAME" '.statuses[] | select(.context | startswith($prefix)) | ((.description // "") | split("\u0027")[1] // empty)')
        fi

        if [ -z "$RELEASE_VERSION" ]; then
          echo "❌ Could not extract release version from repox status"
          exit 1
        fi

        echo "✅ Extracted release version: $RELEASE_VERSION"

        # Set as output
        echo "release-version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

        # Set as environment variable
        echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
