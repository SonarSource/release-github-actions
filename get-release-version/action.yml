name: 'Get Release Version'
description: 'Gets the release version and commit SHA from the repox status.'
author: 'SonarSource'

inputs:
  github-token:
    description: 'The GitHub token for API calls.'
    required: true
    default: ${{ github.token }}
  branch:
    description: 'The branch from which to get the version.'
    required: false
    default: 'master'

outputs:
  release-version:
    description: 'The extracted release version from repox status.'
    value: ${{ steps.get_release_version.outputs.release-version }}
  commit-sha:
    description: 'The commit SHA whose repox status supplied the release version.'
    value: ${{ steps.get_release_version.outputs.commit-sha }}

runs:
  using: 'composite'
  steps:
    - name: Get release version
      id: get_release_version
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BRANCH_NAME: ${{ inputs.branch }}
      run: |
        STATUS_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$BRANCH_NAME/status")
        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        COMMIT_SHA=$(echo "$STATUS_JSON" | jq -r '.sha // empty')
        RELEASE_VERSION=$(echo "$STATUS_JSON" | jq -r --arg ctx "repox-$REPO_NAME-$BRANCH_NAME" '.statuses[] | select(.context == $ctx) | ((.description // "") | split("\u0027")[1] // empty)')

        if [ -z "$RELEASE_VERSION" ]; then
          RELEASE_VERSION=$(echo "$STATUS_JSON" | jq -r --arg prefix "repox-$BRANCH_NAME" 'first(.statuses[] | select(.context | startswith($prefix)) | ((.description // "") | split("\u0027")[1] // empty))')
        fi

        if [ -z "$RELEASE_VERSION" ]; then
          echo "❌ Could not extract release version from repox status"
          exit 1
        fi

        if [ -z "$COMMIT_SHA" ]; then
          echo "❌ Could not extract commit SHA from repox status"
          exit 1
        fi

        if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+|\+[0-9A-Za-z.]+)$ ]]; then
          echo "❌ Extracted release version '$RELEASE_VERSION' does not match expected format X.Y.Z.BUILD or X.Y.Z+BUILD"
          exit 1
        fi

        echo "✅ Extracted release version: $RELEASE_VERSION"
        echo "✅ Resolved release commit: $COMMIT_SHA"

        echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
        echo "commit-sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

        echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
