name: Test Shared Python Helpers

on:
  workflow_call:
  pull_request:
    paths:
      - 'shared/**'
      - '.github/workflows/test-shared.yml'
  push:
    branches:
      - branch-*
    paths:
      - 'shared/**'
      - '.github/workflows/test-shared.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          # shared/ is intentionally not packaged, so borrow the jira pin from a sibling action
          pip install -r create-integration-ticket/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd shared
          python -m pytest test_jira_common.py test_path_utils.py -v --cov=jira_common --cov=path_utils --cov-report=term-missing
