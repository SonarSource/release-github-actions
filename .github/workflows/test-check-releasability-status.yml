name: Test Check Releasability Status Action

on:
  workflow_call:
  pull_request:
    paths:
      - 'check-releasability-status/**'
      - '.github/actions/stub-gh-status/**'
      - '.github/workflows/test-check-releasability-status.yml'
  push:
    branches:
      - branch-*
    paths:
      - 'check-releasability-status/**'
      - '.github/actions/stub-gh-status/**'
      - '.github/workflows/test-check-releasability-status.yml'
  workflow_dispatch:

jobs:
  releasability-scenarios:
    name: Releasability scenarios (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: success-clean-description
            expect_success: "true"
            with_optional_checks: "true"
            expected_state: success
            expected_description: All checks passed
            fixture: |
              { "statuses": [ { "context": "Releasability", "state": "success", "description": "All checks passed" } ] }
          - scenario: state-failure-is-rejected
            expect_success: "false"
            with_optional_checks: "true"
            fixture: |
              { "statuses": [ { "context": "Releasability", "state": "failure", "description": "QA failed" } ] }
          - scenario: state-pending-is-rejected
            expect_success: "false"
            with_optional_checks: "true"
            fixture: |
              { "statuses": [ { "context": "Releasability", "state": "pending", "description": "Still running" } ] }
          - scenario: releasability-context-absent
            expect_success: "false"
            with_optional_checks: "true"
            fixture: |
              { "statuses": [ { "context": "some-other-check", "state": "success", "description": "unrelated" } ] }
          - scenario: null-statuses-field
            expect_success: "false"
            with_optional_checks: "true"
            fixture: |
              { "statuses": null }
          - scenario: failed-optional-checks-rejected-when-enabled
            expect_success: "false"
            with_optional_checks: "true"
            fixture: |
              { "statuses": [ { "context": "Releasability", "state": "success", "description": "Passed but failed optional checks" } ] }
          - scenario: failed-optional-checks-allowed-when-disabled
            expect_success: "true"
            with_optional_checks: "false"
            expected_state: success
            expected_description: Passed but failed optional checks
            fixture: |
              { "statuses": [ { "context": "Releasability", "state": "success", "description": "Passed but failed optional checks" } ] }
          - scenario: failed-optional-checks-match-is-case-insensitive
            expect_success: "false"
            with_optional_checks: "true"
            fixture: |
              { "statuses": [ { "context": "Releasability", "state": "success", "description": "FAILED OPTIONAL CHECKS" } ] }
          - scenario: status-api-failure
            expect_success: "false"
            with_optional_checks: "true"
            stub_exit_code: "1"
            fixture: |
              { "statuses": [] }

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stub gh CLI
        uses: ./.github/actions/stub-gh-status
        with:
          fixture: ${{ matrix.fixture }}
          exit-code: ${{ matrix.stub_exit_code || '0' }}

      - name: Check releasability status
        id: check
        uses: ./check-releasability-status
        with:
          github-token: test-token
          with-optional-checks: ${{ matrix.with_optional_checks }}
        continue-on-error: true

      - name: Verify outcome
        env:
          SCENARIO: ${{ matrix.scenario }}
          EXPECT_SUCCESS: ${{ matrix.expect_success }}
          OUTCOME: ${{ steps.check.outcome }}
          STATE: ${{ steps.check.outputs.releasability-state }}
          DESCRIPTION: ${{ steps.check.outputs.releasability-description }}
          EXPECTED_STATE: ${{ matrix.expected_state }}
          EXPECTED_DESCRIPTION: ${{ matrix.expected_description }}
        run: |
          set -euo pipefail
          if [ "$EXPECT_SUCCESS" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "::error::[$SCENARIO] expected the action to succeed, got '$OUTCOME'"
              exit 1
            fi
            if [ "$STATE" != "$EXPECTED_STATE" ]; then
              echo "::error::[$SCENARIO] expected releasability-state '$EXPECTED_STATE', got '$STATE'"
              exit 1
            fi
            if [ "$DESCRIPTION" != "$EXPECTED_DESCRIPTION" ]; then
              echo "::error::[$SCENARIO] expected releasability-description '$EXPECTED_DESCRIPTION', got '$DESCRIPTION'"
              exit 1
            fi
            echo "[$SCENARIO] accepted, and both outputs match"
          else
            if [ "$OUTCOME" = "success" ]; then
              echo "::error::[$SCENARIO] expected the action to fail, but it succeeded"
              exit 1
            fi
            echo "[$SCENARIO] correctly rejected"
          fi

  branch-input-is-used:
    name: Branch input reaches the status API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stub gh CLI
        uses: ./.github/actions/stub-gh-status
        with:
          fixture: |
            { "statuses": [ { "context": "Releasability", "state": "success", "description": "ok" } ] }

      - name: Check a non-default branch
        uses: ./check-releasability-status
        with:
          github-token: test-token
          branch: release-9.9

      - name: Check the default branch
        uses: ./check-releasability-status
        with:
          github-token: test-token

      - name: Verify the requested branch is the one queried
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gh-stub-args.log"
          echo "gh was called with:"
          cat "$log"
          if ! grep -qF '/commits/release-9.9/status' "$log"; then
            echo "::error::the branch input was not forwarded to the status API"
            exit 1
          fi
          if ! grep -qF '/commits/master/status' "$log"; then
            echo "::error::the documented default branch (master) was not used when branch was omitted"
            exit 1
          fi
          echo "Both the explicit branch and the declared default reached the API"
