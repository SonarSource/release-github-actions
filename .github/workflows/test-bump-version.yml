name: Test Bump Version Script

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'bump-version/**'
      - '.github/workflows/test-bump-version.yml'
  workflow_dispatch:

jobs:
  test-bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up bash permissions
        run: |
          chmod +x bump-version/bump_version.sh
          chmod +x bump-version/test_bump_version.sh

      - name: Run bump version tests
        shell: bash
        run: |
          bash bump-version/test_bump_version.sh

      - name: Check Maven repository routing
        shell: python
        run: |
          import xml.etree.ElementTree as ET

          ns = {"m": "http://maven.apache.org/SETTINGS/1.2.0"}
          settings = ET.parse("bump-version/maven-settings.xml")
          mirrors = settings.findall("m:mirrors/m:mirror", ns)
          assert len(mirrors) == 1
          mirror = mirrors[0]
          assert mirror.findtext("m:mirrorOf", namespaces=ns) == "*", "All repositories must use Repox"
          assert mirror.findtext("m:url", namespaces=ns) == "https://repox.jfrog.io/artifactory/sonarsource"
          servers = settings.findall("m:servers/m:server", ns)
          assert len(servers) == 1
          server = servers[0]
          assert server.findtext("m:id", namespaces=ns) == mirror.findtext("m:id", namespaces=ns)
          assert server.findtext("m:username", namespaces=ns) == "${env.ARTIFACTORY_USERNAME}"
          assert server.findtext("m:password", namespaces=ns) == "${env.ARTIFACTORY_ACCESS_TOKEN}"

