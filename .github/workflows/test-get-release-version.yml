name: Test Get Release Version Action

on:
  workflow_call:
  pull_request:
    paths:
      - 'get-release-version/**'
      - '.github/workflows/test-get-release-version.yml'
  push:
    branches:
      - branch-*
    paths:
      - 'get-release-version/**'
      - '.github/workflows/test-get-release-version.yml'
  workflow_dispatch:

jobs:
  status-response-tests:
    name: Test Status Response Outputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock GitHub status response
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "{\"sha\":\"0123456789abcdef0123456789abcdef01234567\",\"statuses\":[{\"context\":\"repox-test-branch\",\"description\":\"Release version '9.9.9.999'\"}]}"
          EOF
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Get release version and commit SHA
        id: get-version
        uses: ./get-release-version
        with:
          github-token: test-token
          branch: test-branch

      - name: Verify outputs
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.release-version }}
          COMMIT_SHA: ${{ steps.get-version.outputs.commit-sha }}
        run: |
          test "$RELEASE_VERSION" = "9.9.9.999"
          test "$COMMIT_SHA" = "0123456789abcdef0123456789abcdef01234567"

  validation-tests:
    name: Test Input Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Without GitHub Token
        id: test-no-token
        uses: ./get-release-version
        with:
          github-token: ""
        continue-on-error: true

      - name: Verify No Token Failure
        if: steps.test-no-token.outcome == 'success'
        run: |
          echo "✗ Action should have failed when no GitHub token is provided"
          exit 1

      - name: Confirm No Token Failure
        if: steps.test-no-token.outcome == 'failure'
        run: |
          echo "✓ Action correctly failed when no GitHub token is provided"

      - name: Test Default Token Usage
        id: test-default-token
        uses: ./get-release-version
        continue-on-error: true

      - name: Verify Default Token Behavior
        run: |
          echo "Default token test completed"
          echo "Outcome: ${{ steps.test-default-token.outcome }}"
          echo "✓ Action uses default github.token when no token is explicitly provided"

      - name: Summary of Validation Tests
        run: |
          echo "================================"
          echo "Validation Test Results Summary:"
          echo "================================"
          echo "✓ Missing token validation: ${{ steps.test-no-token.outcome == 'failure' && 'PASS' || 'FAIL' }}"
          echo "✓ Default token usage: TESTED"
          echo "================================"

  branch-parameter-tests:
    name: Test Branch Parameter
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Default Branch (master)
        id: test-default-branch
        uses: ./get-release-version
        with:
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Test Custom Branch
        id: test-custom-branch
        uses: ./get-release-version
        with:
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
        continue-on-error: true

      - name: Test Branch Parameter Structure
        run: |
          echo "Testing branch parameter structure..."
          
          # Test that the action file has the branch input defined
          if grep -q "branch:" get-release-version/action.yml; then
            echo "✓ branch input found in action.yml"
          else
            echo "✗ branch input not found in action.yml"
            exit 1
          fi
          
          # Test that the branch input has a default value
          if grep -A3 "branch:" get-release-version/action.yml | grep -q "default.*master"; then
            echo "✓ branch input has default value of master"
          else
            echo "✗ branch input does not have default value of master"
            exit 1
          fi
          
          echo "Branch parameter structure test completed successfully!"

      - name: Verify Branch Parameter Usage
        run: |
          echo "Branch parameter test results:"
          echo "Default branch test outcome: ${{ steps.test-default-branch.outcome }}"
          echo "Custom branch test outcome: ${{ steps.test-custom-branch.outcome }}"

          # Both tests are expected to potentially fail due to missing repox status
          # We're testing that the parameter is accepted and doesn't cause syntax errors
          echo "✓ Branch parameter tests completed without syntax errors"
          echo "✓ Action accepts both default and custom branch parameters"

  repox-status-scenarios:
    name: Test Repox Status Scenarios (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scenario: prefers-repo-specific-status
            expect_success: "true"
            expected_version: "9.9.0.999"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": [ { "context": "repox-master", "description": "Latest promoted build of '8.8.0.888' from branch 'refs/heads/master'" }, { "context": "repox-release-github-actions-master", "description": "Latest promoted build of '9.9.0.999' from branch 'refs/heads/master'" } ] }
          - scenario: falls-back-to-generic-mirror
            expect_success: "true"
            expected_version: "8.8.0.888"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": [ { "context": "repox-master", "description": "Latest promoted build of '8.8.0.888' from branch 'refs/heads/master'" } ] }
          - scenario: rejects-npm-mangled-generic-fallback
            expect_success: "false"
            expected_failure_reason: "invalid-shape"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": [ { "context": "repox-master", "description": "Latest promoted build of '9.9.0-999' from branch 'refs/heads/master'" } ] }
          - scenario: accepts-semver-build-metadata
            expect_success: "true"
            expected_version: "5.2.3+80217"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": [ { "context": "repox-release-github-actions-master", "description": "Latest promoted build of '5.2.3+80217' from branch 'refs/heads/master'" } ] }
          - scenario: no-repox-status-at-all
            expect_success: "false"
            expected_failure_reason: "no-version"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": [ { "context": "other-check", "description": "unrelated" } ] }
          - scenario: null-statuses-field
            expect_success: "false"
            expected_failure_reason: "no-version"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": null }
          - scenario: exact-context-malformed-fails-loud
            expect_success: "false"
            expected_failure_reason: "invalid-shape"
            fixture: |
              { "sha": "abcdef0123456789abcdef0123456789abcdef01", "statuses": [ { "context": "repox-release-github-actions-master", "description": "Latest promoted build of '9.9.0-999' from branch 'refs/heads/master'" }, { "context": "repox-master", "description": "Latest promoted build of '8.8.0.888' from branch 'refs/heads/master'" } ] }

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stub gh CLI
        uses: ./.github/actions/stub-gh-status
        with:
          fixture: ${{ matrix.fixture }}

      - name: Get release version
        id: get-version
        uses: ./get-release-version
        continue-on-error: true

      - name: Verify outcome
        run: |
          if [ "${{ matrix.expect_success }}" = "true" ]; then
            if [ "${{ steps.get-version.outcome }}" != "success" ]; then
              echo "✗ Expected success, action failed (reason: ${{ steps.get-version.outputs.failure-reason }})"
              exit 1
            fi
            if [ "${{ steps.get-version.outputs.release-version }}" != "${{ matrix.expected_version }}" ]; then
              echo "✗ Expected version ${{ matrix.expected_version }}, got '${{ steps.get-version.outputs.release-version }}'"
              exit 1
            fi
            echo "✓ Correctly selected ${{ matrix.expected_version }} for scenario: ${{ matrix.scenario }}"
          else
            if [ "${{ steps.get-version.outcome }}" = "success" ]; then
              echo "✗ Expected failure, action succeeded with version '${{ steps.get-version.outputs.release-version }}'"
              exit 1
            fi
            if [ "${{ steps.get-version.outputs.failure-reason }}" != "${{ matrix.expected_failure_reason }}" ]; then
              echo "✗ Expected failure-reason '${{ matrix.expected_failure_reason }}', got '${{ steps.get-version.outputs.failure-reason }}'"
              exit 1
            fi
            echo "✓ Correctly rejected for scenario: ${{ matrix.scenario }} (reason: ${{ matrix.expected_failure_reason }})"
          fi
