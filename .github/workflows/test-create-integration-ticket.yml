name: Test Create Integration Ticket Action

on:
  workflow_call:
  pull_request:
    paths:
      - 'create-integration-ticket/**'
      - 'shared/**'
      - 'test-fixtures/jira/**'
      - '.github/workflows/test-create-integration-ticket.yml'
  push:
    branches:
      - branch-*
    paths:
      - 'create-integration-ticket/**'
      - 'shared/**'
      - 'test-fixtures/jira/**'
      - '.github/workflows/test-create-integration-ticket.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd create-integration-ticket
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd create-integration-ticket
          python -m pytest test_create_integration_ticket.py -v --cov=create_integration_ticket --cov-report=term-missing

  integration-tests:
    name: Integration Tests (Jira Sandbox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get Jira Credentials from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@c154b4a417b51cb98dd71137f49bf20e77c56820 # v3.4.0
        with:
          secrets: |
            development/kv/data/jira user | JIRA_USER;
            development/kv/data/jira token | JIRA_TOKEN;

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r test-fixtures/jira/requirements.txt

      - name: Create ticket with team
        id: with-team
        uses: ./create-integration-ticket
        with:
          target-jira-project: GHA
          release-ticket-key: 'SONAR-22193'
          ticket-summary: 'Integration ticket test ${{ github.run_id }} — team'
          team: 'f1da89c9-3712-4d15-b194-a4b24406e3e4'
          use-jira-sandbox: 'true'

      - name: Verify team was set in step before
        env:
          JIRA_USER: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          JIRA_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
          TICKET_KEY: ${{ steps.with-team.outputs.ticket-key }}
        run: |
          set -euo pipefail
          python test-fixtures/jira/assert_ticket_fields.py \
            --use-sandbox "true" \
            --ticket-key "$TICKET_KEY" \
            --team "f1da89c9-3712-4d15-b194-a4b24406e3e4" \
            --edition NONE

      - name: Create ticket with edition and team
        id: with-edition
        uses: ./create-integration-ticket
        with:
          target-jira-project: SONAR
          release-ticket-key: 'SONAR-22193'
          ticket-summary: 'Integration ticket test ${{ github.run_id }} — edition'
          edition: 'Community Build & Server'
          team: 'f1da89c9-3712-4d15-b194-a4b24406e3e4'
          use-jira-sandbox: 'true'

      - name: Verify edition and team were set in step before
        env:
          JIRA_USER: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          JIRA_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
          TICKET_KEY: ${{ steps.with-edition.outputs.ticket-key }}
        run: |
          set -euo pipefail
          python test-fixtures/jira/assert_ticket_fields.py \
            --use-sandbox "true" \
            --ticket-key "$TICKET_KEY" \
            --team "f1da89c9-3712-4d15-b194-a4b24406e3e4" \
            --edition "Community Build & Server"

      - name: Create ticket without edition or team
        id: without-fields
        uses: ./create-integration-ticket
        with:
          target-jira-project: SONAR
          release-ticket-key: 'SONAR-22193'
          ticket-summary: 'Integration ticket test ${{ github.run_id }} — no optional fields'
          edition: ''
          team: ''
          use-jira-sandbox: 'true'

      - name: Verify neither field was set
        env:
          JIRA_USER: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          JIRA_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
          TICKET_KEY: ${{ steps.without-fields.outputs.ticket-key }}
        run: |
          set -euo pipefail
          python test-fixtures/jira/assert_ticket_fields.py \
            --use-sandbox "true" \
            --ticket-key "$TICKET_KEY" \
            --team NONE \
            --edition NONE

      # Deleting the created tickets also removes the issue links they added to SONAR-22193.
      - name: Clean up created tickets
        if: always() && steps.secrets.conclusion == 'success'
        env:
          JIRA_USER: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          JIRA_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
          CREATED_KEYS: >-
            ${{ steps.with-team.outputs.ticket-key }},${{ steps.with-edition.outputs.ticket-key }},${{ steps.without-fields.outputs.ticket-key }}
        run: |
          python test-fixtures/jira/cleanup.py \
            --use-sandbox "true" \
            --issue-keys "$CREATED_KEYS"
