name: 'Stub gh CLI for repox status'
description: 'Installs a stub gh CLI on PATH that returns a fixed JSON fixture for any `gh api` call, for testing actions that read commit statuses.'

inputs:
  fixture:
    description: 'JSON fixture the stub gh CLI should print for `gh api` calls.'
    required: true
  exit-code:
    description: 'Exit code the stub gh CLI returns after printing the fixture. Set non-zero to simulate an API failure.'
    required: false
    default: '0'

runs:
  using: 'composite'
  steps:
    - name: Install stub gh CLI and write fixture
      shell: bash
      env:
        FIXTURE_JSON: ${{ inputs.fixture }}
        STUB_EXIT_CODE: ${{ inputs.exit-code }}
      run: |
        mkdir -p "$RUNNER_TEMP/stub-bin"
        printf '%s' "$FIXTURE_JSON" > "$RUNNER_TEMP/gh-stub-fixture.json"
        printf '%s' "$STUB_EXIT_CODE" > "$RUNNER_TEMP/gh-stub-exit-code"
        # Callers can assert on what the action actually asked gh for.
        : > "$RUNNER_TEMP/gh-stub-args.log"
        cat > "$RUNNER_TEMP/stub-bin/gh" <<STUB
        #!/usr/bin/env bash
        printf '%s\n' "\$*" >> "$RUNNER_TEMP/gh-stub-args.log"
        [ "\$1" = "api" ] || { echo "unexpected gh invocation: \$*" >&2; exit 1; }
        cat "$RUNNER_TEMP/gh-stub-fixture.json"
        exit "\$(cat "$RUNNER_TEMP/gh-stub-exit-code")"
        STUB
        chmod +x "$RUNNER_TEMP/stub-bin/gh"
        echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"
